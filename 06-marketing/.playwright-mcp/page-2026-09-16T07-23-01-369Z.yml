            - paragraph [ref=f33e44]: "The request sounds straightforward:"
            - paragraph [ref=f33e45]
            - paragraph [ref=f33e46]: “Can we automate reminders for missing information?”
            - paragraph [ref=f33e47]
            - paragraph [ref=f33e48]: "In this illustrative scenario, Heutrix Diagnostics identifies three problems:"
            - paragraph [ref=f33e49]
            - paragraph [ref=f33e50]: "- different teams disagree about what “complete” means;"
            - paragraph [ref=f33e51]: "- nobody owns the exception decision; and"
            - paragraph [ref=f33e52]: "- the data needed to trigger the reminder is not recorded consistently."
            - paragraph [ref=f33e53]
            - paragraph [ref=f33e54]: Automating now would send conflicting reminders faster.
            - paragraph [ref=f33e55]
            - paragraph [ref=f33e56]: "The more useful first move is no build:"
            - paragraph [ref=f33e57]
            - paragraph [ref=f33e58]: 1. Agree one decision rule.
            - paragraph [ref=f33e59]: 2. Name the person who approves exceptions.
            - paragraph [ref=f33e60]: 3. Run a short baseline using non-sensitive operational data.
            - paragraph [ref=f33e61]: 4. Reassess whether automation is still justified.
            - paragraph [ref=f33e62]
            - paragraph [ref=f33e63]: "That is what good diagnosis should do: compare process clarification, a manual control, a lightweight workflow and automation—then recommend the smallest option supported by the evidence."
            - paragraph [ref=f33e64]
            - paragraph [ref=f33e65]: The value is the decision, even when the answer is “not yet”.
            - paragraph [ref=f33e66]
            - paragraph [ref=f33e67]: "Save this question for the next automation request:"
            - paragraph [ref=f33e68]
