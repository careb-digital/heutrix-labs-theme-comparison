            - paragraph [ref=f75e601]: "- the next action and review date;"
            - paragraph [ref=f75e602]: "- any exception requiring a decision; and"
            - paragraph [ref=f75e603]: "- who confirms readiness under the provider’s approved process."
            - paragraph [ref=f75e604]
            - paragraph [ref=f75e605]: The workflow should not infer readiness from a green cell or a completed checklist. A named person still makes the accountable decision.
            - paragraph [ref=f75e606]
            - paragraph [ref=f75e607]: Nor does every sensitive record need to be copied into the view. Often the operating layer needs only enough controlled information to show what happens next.
