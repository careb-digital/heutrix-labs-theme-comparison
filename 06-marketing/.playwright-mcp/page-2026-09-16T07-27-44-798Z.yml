            - paragraph [ref=f75e587]: Illustrative operating view — not compliance or service-readiness assurance.
            - paragraph [ref=f75e588]
            - paragraph [ref=f75e589]: “Starting soon” is not a service-commencement status.
            - paragraph [ref=f75e590]
            - paragraph [ref=f75e591]: Neither is “almost ready”.
            - paragraph [ref=f75e592]
            - paragraph [ref=f75e593]: Those phrases hide the decisions an accountable person still needs to make.
            - paragraph [ref=f75e594]
            - paragraph [ref=f75e595]: "A practical commencement view should show, at an appropriate level:"
            - paragraph [ref=f75e596]
            - paragraph [ref=f75e597]: "- the intended start date;"
