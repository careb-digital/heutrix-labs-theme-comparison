          - textbox "Text editor for creating content" [active] [ref=f22e1144]:
            - paragraph [ref=f22e1145]: “We need a new system” is often the first proposed solution.
            - paragraph [ref=f22e1146]
            - paragraph [ref=f22e1147]: It should be the sixth question.
            - paragraph [ref=f22e1148]
            - paragraph [ref=f22e1149]: "Before choosing software, automation or AI, answer these five:"
            - paragraph [ref=f22e1150]
            - paragraph [ref=f22e1151]: "1. Trigger: what starts the work?"
            - paragraph [ref=f22e1152]: "2. Owner: who is accountable for the next action?"
            - paragraph [ref=f22e1153]: "3. Information: what is needed, and where should it live?"
            - paragraph [ref=f22e1154]: "4. Exception: what happens when the normal path breaks?"
            - paragraph [ref=f22e1155]: "5. Finish: what does done mean, and who confirms it?"
            - paragraph [ref=f22e1156]
            - paragraph [ref=f22e1157]: If those answers are unclear, new technology can make the confusion move faster.
            - paragraph [ref=f22e1158]
            - paragraph [ref=f22e1159]: "The smallest useful improvement may be:"
            - paragraph [ref=f22e1160]
            - paragraph [ref=f22e1161]: "- one agreed handover;"
            - paragraph [ref=f22e1162]: "- a controlled status and next-action view;"
            - paragraph [ref=f22e1163]: "- a simpler form;"
            - paragraph [ref=f22e1164]: "- one stable automation;"
            - paragraph [ref=f22e1165]: "- a lightweight internal tool; or"
            - paragraph [ref=f22e1166]: "- no build at all."
            - paragraph [ref=f22e1167]
            - paragraph [ref=f22e1168]: "That is the Heutrix principle: improve the workflow before adding technology."
            - paragraph [ref=f22e1169]
            - paragraph [ref=f22e1170]: If several workflows are competing for attention, use the free Workflow Bottleneck Scorecard to assess one at a time. The interactive tool suggests a next step from the friction, evidence and readiness you report. The accompanying PDF guide and workbook help you compare workflows. No email address is required.
            - paragraph [ref=f22e1171]
            - paragraph [ref=f22e1172]: "Get the Scorecard: https://lnkd.in/gyFjMpB9"
            - paragraph [ref=f22e1173]
            - paragraph [ref=f22e1174]: A self-assessment is a starting point, not a verified business case.
            - paragraph [ref=f22e1175]
