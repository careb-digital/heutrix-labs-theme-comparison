              - generic [ref=f22e540]:
                - generic [ref=f22e541]:
                  - text: "Your workflow may be a shared memory disguised as a system. Seven signs: 1. A manager has to ask several people for one update. 2. Staff keep side spreadsheets to make the main process usable. 3. The same information is copied into more than one place. 4. A waiting item is discovered only when someone chases it. 5. Work slows down when one key person is away. 6. “Done” means something different across the team. 7. Reporting begins with a manual clean-up before anyone trusts it. None of these proves you need a new platform. They do suggest one repeated workflow deserves a closer look. Start small: choose one item that entered the process this week. Can the right person see its owner, status, next action, review date and finish without asking for the backstory? If not, that is a useful place to begin. Which sign would you inspect first? Keep examples general and leave participant, worker and confidential information out of the comments."
