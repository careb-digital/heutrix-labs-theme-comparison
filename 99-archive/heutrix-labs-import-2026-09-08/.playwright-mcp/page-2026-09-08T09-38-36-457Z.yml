          - paragraph [ref=f66e277]: Our four-step approach
          - heading "The Heutrix Method." [level=2] [ref=f66e278]: The HeutrixMethod.
          - paragraph [ref=f66e279]: Understand the problem. Prioritise what matters. Build the right improvement and leave your team ready to use it.
          - paragraph [ref=f66e280]: We start with the workflow. The right next step may be a process change, a scoped build or a no-build recommendation.
