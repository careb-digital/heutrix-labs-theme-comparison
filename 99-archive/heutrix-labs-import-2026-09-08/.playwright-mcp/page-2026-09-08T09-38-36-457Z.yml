            - generic [ref=f66e298]:
              - heading "Build" [level=3] [ref=f66e299]
              - paragraph [ref=f66e300]: Implement the simplest suitable improvement, using automation where it helps. Test the workflow, permissions and exception paths, with accountable human review.
